---
# Koppie Linux Calamares settings v2 (OFFLINE, GRUB, BIOS+UEFI)
modules-search: [ local ]

instances: []

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - bootloader
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - packages
  - grubcfg
  - shellprocess
  - removeuser
  - umount
- fail:
  - umount

branding: koppie
prompt-install: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
