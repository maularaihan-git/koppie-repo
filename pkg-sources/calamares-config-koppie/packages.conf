---
# packages: BERSIHIN live-only dari sistem hasil install (OFFLINE: no update_db).
# try_remove = gagal juga lanjut, bukan abort.
backend: pacman
update_db: false
update_system: false
operations:
  - try_remove:
    - calamares-config-koppie
    - calamares
    - koppie-archiso-hookfix
    - archiso
    - mkinitcpio-archiso
    - squashfs-tools
