---
# unpackfs: copy live system (archiso airootfs) ke target. OFFLINE.
unpack:
    - source: "/run/archiso/bootmnt/koppie/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
    # Kernel live ada DI LUAR squashfs (/boot dalam squashfs itu kosong!),
    # jadi vmlinuz wajib dicopy mentah dari bootmnt, kalau tidak target
    # tidak bisa boot (grub.cfg kosong tanpa menuentry -> jatuh ke grub> prompt).
    # initramfs-nya dibikin shellprocess via mkinitcpio -P (jangan copy yg live).
    - source: "/run/archiso/bootmnt/koppie/boot/x86_64/vmlinuz-linux-lts"
      sourcefs: "file"
      destination: "/boot/vmlinuz-linux-lts"
