---
# shellprocess: beresin target habis unpack (jalan di DALAM chroot target).
# 1. Hapus archiso.conf (live-only, bikin mkinitcpio target gagal kayak di ISO)
# 2. Generate initramfs STOK (tanpa hook archiso) biar sistem hasil install bisa boot
# 3. Update GRUB biar os-prober kedetect
dontChroot: false
timeout: 900
commands:
    - command: rm -f /etc/mkinitcpio.conf.d/archiso.conf
      timeout: 30
    - command: mkinitcpio -P
      timeout: 600
    - command: grub-mkconfig -o /boot/grub/grub.cfg
      timeout: 120
