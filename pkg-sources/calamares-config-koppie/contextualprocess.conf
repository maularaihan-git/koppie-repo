---
# contextualprocess: normalisasi source install SEBELUM partisi (jalan di live, bukan chroot).
# Kasus: boot copytoram + USB dicabut/rusak -> /run/archiso/bootmnt kosong,
# unpackfs mati dengan pesan samar. Job ini:
#  1. symlink ulang source dari copy RAM (/run/archiso/copytoram) kalau ada,
#  2. kalau tetap tidak ada -> GAGAL CEPAT dengan pesan bahasa manusia
#     (SEBELUM partisi diutak-atik!).
dontChroot: true
timeout: 120
firmwareType:
    "*":
        - command: /bin/sh -c 'S=/run/archiso/bootmnt/koppie/x86_64/airootfs.sfs; C=/run/archiso/copytoram/airootfs.sfs; V=/run/archiso/bootmnt/koppie/boot/x86_64/vmlinuz-linux-lts; VC=/run/archiso/copytoram/vmlinuz-linux-lts; if [ ! -e $S ] && [ -e $C ]; then umount -l /run/archiso/bootmnt 2>/dev/null; mkdir -p $(dirname $S) $(dirname $V); ln -sf $C $S; [ -e $VC ] && ln -sf $VC $V; fi; [ -e $S ] && [ -e $V ] || { echo File installer Koppie tidak ditemukan. Pastikan USB installer masih terpasang, lalu ulangi dari awal.; exit 1; }'
          timeout: 120
