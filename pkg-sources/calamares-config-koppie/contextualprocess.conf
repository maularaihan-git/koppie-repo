---
# contextualprocess: normalisasi source install SEBELUM partisi (jalan di live, bukan chroot).
# Kasus: boot copytoram + USB dicabut/rusak -> /run/archiso/bootmnt kosong,
# unpackfs mati dengan pesan samar. Job ini:
#  1. symlink ulang source dari copy RAM (/run/archiso/copytoram) kalau ada,
#  2. kalau tetap tidak ada -> GAGAL CEPAT dengan pesan bahasa manusia
#     (SEBELUM partisi diutak-atik!).
# PENTING: jangan pakai $VARIABEL shell di command (dianggap variabel Calamares!).
dontChroot: true
timeout: 120
firmwareType:
    "*":
        - command: /bin/sh -c 'if [ ! -e /run/archiso/bootmnt/koppie/x86_64/airootfs.sfs ] && [ -e /run/archiso/copytoram/airootfs.sfs ]; then umount -l /run/archiso/bootmnt 2>/dev/null; mkdir -p /run/archiso/bootmnt/koppie/x86_64 /run/archiso/bootmnt/koppie/boot/x86_64; ln -sf /run/archiso/copytoram/airootfs.sfs /run/archiso/bootmnt/koppie/x86_64/airootfs.sfs; [ -e /run/archiso/copytoram/vmlinuz-linux-lts ] && ln -sf /run/archiso/copytoram/vmlinuz-linux-lts /run/archiso/bootmnt/koppie/boot/x86_64/vmlinuz-linux-lts; fi; [ -e /run/archiso/bootmnt/koppie/x86_64/airootfs.sfs ] && [ -e /run/archiso/bootmnt/koppie/boot/x86_64/vmlinuz-linux-lts ] || { echo File installer Koppie tidak ditemukan. Pastikan USB installer masih terpasang, lalu ulangi dari awal.; exit 1; }'
          timeout: 120
